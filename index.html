<body>
<header class="top">
  <button id="menuBtn" aria-label="Meni" aria-controls="side" aria-expanded="false">☰ Meni</button>
  <div class="ttl"><b>Fizika I</b><span class="sub">Mehanika in toplota · 1. kolokvij · vodič po tipih nalog</span></div>
  <div class="cnt"><span class="lbl">Osvojeni tipi: </span><b id="cntZnam">0/8</b></div>
  <button id="themeBtn" aria-label="Tema">🌓 Sistem</button>
</header>

  <nav id="side" aria-label="Vsebina"></nav>

<script>
'use strict';
/* =========================================================
   KONSTANTE
   ========================================================= */
const CONST = {
  g: 9.81,        // m/s^2 – formular (privzeto)
  g_kol: 9.8,     // m/s^2 – vrednost, ki jo naloge 2022/3, 2023/3, 2023/4 podajo same
  R_Z: 6.4e6,     // m – polmer Zemlje (formular in kolokviji: 6400 km)
  G: 6.67e-11     // N m^2/kg^2 – formular
};
const DEG = Math.PI / 180;

/* =========================================================
   OBLIKOVANJE ŠTEVIL (decimalna vejica, 3 veljavna mesta)
   ========================================================= */
// vrne {m: mantisa kot niz s piko, e: eksponent ali null}
function sigParts(x, sig) {
  if (!isFinite(x)) return { m: String(x), e: null };
  if (x === 0) return { m: (0).toFixed(Math.max(0, sig - 1)), e: null };
  const ax = Math.abs(x);
  let e = Math.floor(Math.log10(ax));
  let mant = x / Math.pow(10, e);
  let ms = mant.toFixed(sig - 1);
  if (Math.abs(parseFloat(ms)) >= 10) { e += 1; mant = x / Math.pow(10, e); ms = mant.toFixed(sig - 1); }
  if (e >= 4 || e <= -4) return { m: ms, e };
  // navaden zapis
  const dec = Math.max(0, sig - 1 - e);
  if (dec === 0) return { m: Number(x.toPrecision(sig)).toFixed(0), e: null };
  return { m: x.toFixed(dec), e: null };
}
function fmtN(x, sig = 3) {           // TeX
  const p = sigParts(x, sig);
  const m = p.m.replace('.', '{,}');
  return p.e === null ? m : m + String.raw`\cdot 10^{` + p.e + '}';
}
function fmt3(x) { return fmtN(x, 3); }
function fmtPlain(x, sig = 3) {       // navaden tekst
  const p = sigParts(x, sig);
  const m = p.m.replace('.', ',').replace('-', '−');
  return p.e === null ? m : m + '·10^' + p.e;
}
// vhodne vrednosti v vrstici z vstavljenimi številkami: do 4 mest, brez odvečnih ničel
function fmtIn(x) {
  if (x === 0) return '0';
  const ax = Math.abs(x);
  if (ax >= 1e5 || ax < 1e-3) {
    const p = sigParts(x, 4);
    let m = p.m.replace(/\.?0+$/, '');
    return m.replace('.', '{,}') + String.raw`\cdot 10^{` + p.e + '}';
  }
  let s = Number(x.toPrecision(4)).toString();
  return s.replace('.', '{,}');
}
const T = (s) => String.raw`\(` + s + String.raw`\)`;   // inline TeX

/* =========================================================
   RAZČLENJEVALNIK KOLIČIN
   ========================================================= */
const DIMS = {
  dolzina:  { ime: 'dolžino', npr: '15 m', si: 'm' },
  cas:      { ime: 'čas', npr: '2 s', si: 's' },
  hitrost:  { ime: 'hitrost', npr: '15 m/s', si: 'm/s' },
  pospesek: { ime: 'pospešek', npr: '9,81 m/s^2', si: 'm/s^2' },
  masa:     { ime: 'maso', npr: '2 kg', si: 'kg' },
  sila:     { ime: 'silo', npr: '70 N', si: 'N' },
  kot:      { ime: 'kot', npr: '30°', si: 'rad' },
  kotna:    { ime: 'kotno hitrost', npr: '2 rad/s', si: 'rad/s' },
  vztr:     { ime: 'vztrajnostni moment', npr: '6 kg m^2', si: 'kg\\,m^2' },
  vrtilna:  { ime: 'vrtilno količino', npr: '12 kg m^2/s', si: 'kg\\,m^2/s' },
  energija: { ime: 'energijo', npr: '12 J', si: 'J' },
  brez:     { ime: 'brezdimenzijsko število', npr: '0,2', si: '' }
};
const UNITS = {
  // dolžina
  'mm': ['dolzina', 1e-3, 'mm'], 'cm': ['dolzina', 1e-2, 'cm'], 'dm': ['dolzina', 0.1, 'dm'], 'm': ['dolzina', 1, 'm'], 'km': ['dolzina', 1e3, 'km'],
  // čas
  'ms': ['cas', 1e-3, 'ms'], 's': ['cas', 1, 's'], 'min': ['cas', 60, 'min'], 'h': ['cas', 3600, 'h'],
  // hitrost
  'm/s': ['hitrost', 1, 'm/s'], 'km/h': ['hitrost', 1 / 3.6, 'km/h'], 'km/s': ['hitrost', 1e3, 'km/s'], 'cm/s': ['hitrost', 1e-2, 'cm/s'],
  // pospešek
  'm/s^2': ['pospesek', 1, 'm/s^2'], 'm/s2': ['pospesek', 1, 'm/s^2'], 'cm/s^2': ['pospesek', 1e-2, 'cm/s^2'],
  // masa
  'mg': ['masa', 1e-6, 'mg'], 'g': ['masa', 1e-3, 'g'], 'dag': ['masa', 1e-2, 'dag'], 'kg': ['masa', 1, 'kg'], 't': ['masa', 1e3, 't'],
  // sila
  'n': ['sila', 1, 'N'], 'kn': ['sila', 1e3, 'kN'], 'mn': ['sila', 1e-3, 'mN'], 'MN': ['sila', 1e6, 'MN'],
  // kot
  '°': ['kot', DEG, '^\\circ'], 'deg': ['kot', DEG, '^\\circ'], 'rad': ['kot', 1, 'rad'],
  // kotna hitrost
  'rad/s': ['kotna', 1, 'rad/s'], 'obr/min': ['kotna', 2 * Math.PI / 60, 'obr/min'], 'obr/s': ['kotna', 2 * Math.PI, 'obr/s'], '1/s': ['kotna', 1, '1/s'], 's^-1': ['kotna', 1, 's^{-1}'],
  // vztrajnostni moment
  'kgm^2': ['vztr', 1, 'kg\\,m^2'], 'gcm^2': ['vztr', 1e-7, 'g\\,cm^2'],
  // vrtilna količina
  'kgm^2/s': ['vrtilna', 1, 'kg\\,m^2/s'], 'js': ['vrtilna', 1, 'J\\,s'],
  // energija
  'j': ['energija', 1, 'J'], 'kj': ['energija', 1e3, 'kJ'], 'mj': ['energija', 1e-3, 'mJ']
};
function lookupUnit(u) {
  if (u in UNITS) return UNITS[u];
  // velike/male črke samo pri N, J (kN, mN, kJ …); MN ostane ločen
  const lo = u.toLowerCase();
  if (u[0] !== 'M' && u[0] !== 'K' && /^(k|m)?[nj]$/i.test(u) && lo in UNITS) return UNITS[lo];
  if (/^js$/i.test(u)) return UNITS['js'];
  return null;
}
// parseQty(str, dim) → {si, unitSI, ok, msg, val, unit}
function parseQty(str, dim) {
  const d = DIMS[dim] || DIMS.brez;
  const bad = (msg) => ({ si: NaN, unitSI: d.si, ok: false, msg });
  if (str == null) return bad('prazno polje');
  let s = String(str).trim();
  if (!s) return bad('prazno polje');
  s = s.replace(/[−–]/g, '-').replace(/,/g, '.').replace(/²/g, '^2').replace(/³/g, '^3').replace(/ /g, ' ');
  s = s.replace(/\s*[·×*x]\s*10\s*\^\s*\(?\s*([+-]?\d+)\s*\)?/i, 'e$1');   // 6,4·10^6
  s = s.replace(/^\s*([+-]?)\s*/, '$1');
  const m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)\s*(.*)$/i);
  if (!m) return bad('ni število – vpiši npr. ' + d.npr);
  const val = parseFloat(m[1]);
  let u = m[2].trim().replace(/\s+|·|\*/g, '');
  u = u.replace(/^stopinj[e]?$/i, '°').replace(/^o$/, '°');
  if (!isFinite(val)) return bad('ni število');
  if (u === '') {
    if (dim === 'brez') return { si: val, unitSI: '', ok: true, msg: '', val, unit: '' };
    if (dim === 'kot') return { si: val * DEG, unitSI: 'rad', ok: true, msg: 'brez enote → stopinje', val, unit: '^\\circ', assumed: true };

const PARSER_TESTS = [
  ['72 km/h', 'hitrost', 20], ['3 km/s', 'hitrost', 3000], ['15 m/s', 'hitrost', 15], ['15 cm', 'dolzina', 0.15],
  ['6400 km', 'dolzina', 6.4e6], ['100 km', 'dolzina', 1e5], ['2,5 kN', 'sila', 2500], ['70 N', 'sila', 70],
  ['9 g', 'masa', 0.009], ['2 kg', 'masa', 2], ['1,5 t', 'masa', 1500], ['30°', 'kot', 0.523599], ['30 deg', 'kot', 0.523599],
  ['0,5 rad', 'kot', 0.5], ['60 obr/min', 'kotna', 6.283185], ['1 m/s^2', 'pospesek', 1], ['9,81 m/s²', 'pospesek', 9.81],
  ['250 ms', 'cas', 0.25], ['2 min', 'cas', 120], ['6,4·10^6 m', 'dolzina', 6.4e6], ['6.4e6 m', 'dolzina', 6.4e6],
  ['0,2', 'brez', 0.2], ['  20  m/s ', 'hitrost', 20], ['15 kg', 'hitrost', 'ERR'], ['abc', 'dolzina', 'ERR'], ['-15 m/s', 'hitrost', -15],
  ['1 m/s²', 'pospesek', 1], ['2 kg m^2', 'vztr', 2], ['12 J s', 'vrtilna', 12], ['5 mN', 'sila', 0.005]
];
function runParserTests() {
  const res = [];
  for (const [inp, dim, exp] of PARSER_TESTS) {
    const p = parseQty(inp, dim);
    let pass;
    if (exp === 'ERR') pass = !p.ok;
    else pass = p.ok && Math.abs(p.si - exp) <= 1e-6 * Math.max(1, Math.abs(exp));
    res.push({ inp, dim, exp, got: p.ok ? p.si : p.msg, pass });
  }
  return res;
}

/* =========================================================
   PRIMERJAVA »MOJ REZULTAT«
   ========================================================= */
// exp: pričakovana SI vrednost; alt: vrednost z drugim g (ali null)
function checkResult(str, dim, exp, alt) {
  const p = parseQty(str, dim);
  if (!p.ok) return { cls: 'bad', msg: p.msg };
  const u = p.si;
  const rel = (a, b) => b === 0 ? Math.abs(a) : Math.abs(a - b) / Math.abs(b);
  if (rel(u, exp) <= 0.01) return { cls: 'ok', msg: '✓ Ujema se' };
  if (exp !== 0 && rel(-u, exp) <= 0.01) return { cls: 'or', msg: 'Napačen predznak – preveri smer osi' };
  if (alt != null && isFinite(alt) && rel(u, alt) <= 0.01) return { cls: 'ok', msg: String.raw`✓ (razlika samo zaradi \(g\))` };
  if (dim === 'kot' && exp !== 0 && (rel(u, exp / DEG) <= 0.01 || rel(u, exp * DEG) <= 0.01)) return { cls: 'or', msg: 'Preveri stopinje/radiane' };
  if (exp !== 0 && u !== 0) {
    const r = u / exp;
    for (const k of [1, 2, 3, 6]) {
      const f = Math.pow(10, k);
      if (Math.abs(r / f - 1) <= 0.02 || Math.abs(r * f - 1) <= 0.02) return { cls: 'or', msg: 'Napaka za potenco 10 – preveri pretvorbo enot' };
    }
  }
  return { cls: 'bad', msg: '✗ Ne ujema se', wrong: true };
}

/* ---- klanec: pomočniki ---- */
function inclineGeom(base, ang) {
  const u = pt(Math.cos(ang * DEG), -Math.sin(ang * DEG)), n = pt(-Math.sin(ang * DEG), -Math.cos(ang * DEG));
  const P = (s, h = 0) => pt(base.x + s * u.x + h * n.x, base.y + s * u.y + h * n.y);
  return { u, n, P };
}
function block(G, s, w, h, fill) {
  return poly([G.P(s), G.P(s + w), G.P(s + w, h), G.P(s, h)], C.fg, fill || C.bg, 2);
}

/* ---- 2025/3: dve kladi na klancu ---- */
function svgKladi(sol = true) {
  const base = pt(30, 330), a = 30, G = inclineGeom(base, a);
  const end = G.P(560);
  let s = ln(base.x, base.y, end.x + 10, base.y, C.fg, 2) + ln(base.x, base.y, end.x, end.y, C.fg, 2);
  s += arcA(base.x, base.y, 55, 0, a) + tx(base.x + 62, base.y - 8, '30°', { it: false });
  const b1 = { s: 110, w: 80, h: 56 }, b2 = { s: 300, w: 96, h: 68 };
  s += block(G, b1.s, b1.w, b1.h) + block(G, b2.s, b2.w, b2.h);
  const c1 = G.P(b1.s + b1.w / 2, b1.h / 2), c2 = G.P(b2.s + b2.w / 2, b2.h / 2);
  if (sol) {
    const l1 = G.P(b1.s + 6, b1.h + 14), l2 = G.P(b2.s + 6, b2.h + 14);
    s += tx(l1.x, l1.y, '2 kg', { it: false, rot: -a, sm: 1 }) + tx(l2.x, l2.y, '5 kg', { it: false, rot: -a, sm: 1 });
  } else {
    s += tx(c1.x, c1.y + 5, '2 kg', { a: 'middle', it: false, rot: -a });
    s += tx(c2.x, c2.y + 5, '5 kg', { a: 'middle', it: false, rot: -a });
  }
  const r1p = G.P(b1.s + b1.w, 22), r2p = G.P(b2.s, 22);
  s += ln(r1p.x, r1p.y, r2p.x, r2p.y, C.fg, 1.5);
  const f1 = G.P(b2.s + b2.w, 34), f2 = G.P(b2.s + b2.w + 85, 34);
  s += arr(f1.x, f1.y, f2.x, f2.y, C.fg, 2.5) + tx(f2.x - 30, f2.y - 16, '70 N', { it: false, rot: -a });
  if (sol) {
    const draw = (c, b, L, tDir, lab) => {
      let q = '';
      const ds = L * Math.sin(a * DEG), dc = L * Math.cos(a * DEG);
      q += arr(c.x, c.y, c.x - G.u.x * ds, c.y - G.u.y * ds, C.F, 1.3, '4 3');
      q += arr(c.x, c.y, c.x - G.n.x * dc, c.y - G.n.y * dc, C.F, 1.3, '4 3');
      q += arr(c.x, c.y, c.x, c.y + L, C.F, 2.5) + tx(c.x + 6, c.y + L + 4, 'm' + lab + 'g', { c: C.F, sm: 1 });
      q += arr(c.x, c.y, c.x + G.n.x * dc, c.y + G.n.y * dc, C.F, 2.5);
      const nl = pt(c.x + G.n.x * dc, c.y + G.n.y * dc); q += tx(nl.x - 6, nl.y + 2, 'F_n', { c: C.F, sm: 1, a: 'end' });
      const sp = G.P(b.s + b.w * 0.25, 0); const fe = pt(sp.x - G.u.x * 34, sp.y - G.u.y * 34);
      q += arr(sp.x, sp.y, fe.x, fe.y, C.F, 2.5) + tx(fe.x + 2, fe.y + 20, 'F_t', { c: C.F, sm: 1, a: 'middle' });
      const tp = G.P(tDir > 0 ? b.s + b.w : b.s, 22); const te = pt(tp.x + tDir * G.u.x * 34, tp.y + tDir * G.u.y * 34);
      const tl = pt(te.x + G.n.x * 14, te.y + G.n.y * 14);
      q += arr(tp.x, tp.y, te.x, te.y, C.F, 2.5) + tx(tl.x, tl.y, 'T', { c: C.F, sm: 1, a: 'middle' });
      return q;
    };
    s += draw(c1, b1, 48, +1, '_1') + draw(c2, b2, 62, -1, '_2');
    const a1 = G.P(180, 150), a2 = G.P(290, 150);
    s += arr(a1.x, a1.y, a2.x, a2.y, C.A, 3) + tx((a1.x + a2.x) / 2 - 6, (a1.y + a2.y) / 2 - 12, 'a', { c: C.A });
  }
  return svgWrap(580, 350, s, sol ? 'Sile so v barvi sile; črtkano: komponenti teže \\(mg\\sin\\alpha\\) in \\(mg\\cos\\alpha\\).' : '');
}

    const q2 = pt(c.x - G.n.x * dc, c.y - G.n.y * dc); s += tx(q2.x + 8, q2.y + 6, 'mg cos α', { c: C.F, sm: 1 });
    s += arr(c.x, c.y, c.x + G.n.x * dc, c.y + G.n.y * dc, C.F, 2.5);
    const q3 = pt(c.x + G.n.x * dc, c.y + G.n.y * dc); s += tx(q3.x - 6, q3.y, 'F_n', { c: C.F, sm: 1, a: 'end' });
    const sp = G.P(b.s + b.w, 6), se = pt(sp.x + G.u.x * 45, sp.y + G.u.y * 45);
    s += arr(sp.x, sp.y, se.x, se.y, C.F, 2.5) + tx(se.x + 4, se.y - 6, 'F_l', { c: C.F, sm: 1 });

  return svgWrap(460, 265, s);

  const p1 = pt(cx + R * Math.cos(a1 * DEG), 120 - R * Math.sin(a1 * DEG)), p2 = pt(cx + R * Math.cos(a2 * DEG), 120 - R * Math.sin(a2 * DEG));
  s += pathD('M' + r1(p1.x) + ' ' + r1(p1.y) + ' A' + R + ' ' + R + ' 0 0 1 ' + r1(p2.x) + ' ' + r1(p2.y), C.V, w) + head(p2.x, p2.y, Math.sin(a2 * DEG), Math.cos(a2 * DEG), C.V, 9 + w);
  s += tx(cx, 48, lab, { a: 'middle', c: C.V });
  s += darr(cx, 172, cx + r, 172) + tx(cx + r / 2, 190, rl, { a: 'middle' });
  return s;
}
function svgStolZgoraj(sol = true) {

/* ---- 2022/2: voziček z utežjo na vrvici ---- */
function cart(cx, alpha, sol) {
  let s = rect(cx - 70, 175, 140, 30, C.fg, C.p2, 2) + circ(cx - 45, 214, 10, C.fg, C.bg, 2) + circ(cx + 45, 214, 10, C.fg, C.bg, 2);
  s += ln(cx - 50, 175, cx - 50, 70, C.fg, 3) + ln(cx - 50, 70, cx + 25, 70, C.fg, 3);
  const pv = pt(cx + 25, 70), Ls = 82;
  const bob = pt(pv.x - Ls * Math.sin(alpha * DEG), pv.y + Ls * Math.cos(alpha * DEG));
  s += ln(pv.x, pv.y, bob.x, bob.y, C.fg, 1.5) + circ(bob.x, bob.y, 8, C.fg, C.fg, 1);
  if (alpha) {
    s += ln(pv.x, pv.y, pv.x, pv.y + 95, C.mu, 1.2, '4 3') + arcA(pv.x, pv.y, 40, 270 - alpha, 270) + tx(pv.x - 9, pv.y + 56, 'α', { a: 'end', sm: 1 });
    if (sol) {
      const T = 55, ux = Math.sin(alpha * DEG), uy = -Math.cos(alpha * DEG);
      s += arr(bob.x, bob.y, bob.x, bob.y + 48, C.F, 2.5) + tx(bob.x - 8, bob.y + 46, 'm_ug', { c: C.F, sm: 1, a: 'end' });
      s += arr(bob.x, bob.y, bob.x + ux * T, bob.y + uy * T, C.F, 2.5) + tx(bob.x + ux * T + 6, bob.y + uy * T + 18, 'T', { c: C.F, sm: 1 });
      s += arr(bob.x, bob.y, bob.x + ux * T, bob.y, C.F, 1.3, '4 3') + tx(bob.x + ux * T + 4, bob.y + 14, 'T sin α', { c: C.F, sm: 1 });
      s += arr(bob.x, bob.y, bob.x, bob.y + uy * T, C.F, 1.3, '4 3') + tx(bob.x - 6, bob.y + uy * T + 6, 'T cos α', { c: C.F, sm: 1, a: 'end' });
    }
  }
  return s;
}
function svgVozicek(sol = true) {
  let s = ln(10, 225, 450, 225, C.fg, 2);
  s += cart(110, 0, sol) + tx(110, 256, 'miruje', { a: 'middle', it: false, sm: 1 });
  if (sol) {
    s += cart(340, 22, sol) + arr(300, 34, 380, 34, C.A, 3) + tx(388, 40, 'a_0', { c: C.A });
    s += tx(340, 256, 'pospešuje v desno', { a: 'middle', it: false, sm: 1 });
  } else {
    s += arr(200, 34, 280, 34, C.A, 3) + tx(288, 40, 'a_0', { c: C.A }) + tx(240, 60, '(pospešek med vožnjo)', { a: 'middle', it: false, sm: 1, c: C.mu });
  }
  return svgWrap(460, 268, s, sol ? 'Utež se nagne nazaj, nasproti pospešku.' : 'Na sliki voziček miruje.');
}

{ id: '2025/1', leto: 2025, st: 1, tip: 'steiner', simbolna: true, uradno: null, g: null, svg: 'svgPalicaD',
  besedilo: R`Izpeljite vztrajnostni moment homogene palice s konstantnim presekom okoli osi, ki je za razdaljo \(D\) oddaljena od enega krajišča (\(D\) je manjši od \(L/2\)). Dolžina palice je \(L\), masa palice pa \(m\).`,
  podatkiTab: [[R`m,\ L`, 'masa in dolžina palice'], [R`D\lt L/2`, 'razdalja osi od krajišča']],
  prviKorak: R`Razdalja osi od težišča \(L/2-D\).`,
  koraki: [
    [R`r^*=\dfrac L2-D`, R`Težišče je \(L/2\) od krajišča, os je \(D\) od istega krajišča.`],
    [R`J=\dfrac{mL^2}{12}+m\left(\dfrac L2-D\right)^2=\dfrac{mL^2}{3}-mLD+mD^2`, R`Pot A (Steiner): začnemo od težiščnega \(J^*=mL^2/12\).`],
    [R`J=\int_{-D}^{L-D}x^2\,\frac{m}{L}\,dx=\frac{m}{3L}\left[(L-D)^3+D^3\right]=\frac{mL^2}{3}-mLD+mD^2`, R`Pot B (integral, če zahtevajo »izpeljite«): os v izhodišču, palica od \(x=-D\) do \(x=L-D\), \(dm=\tfrac mL dx\).`],
    [R`D=0\Rightarrow\tfrac{mL^2}{3}\ \checkmark,\qquad D=\tfrac L2\Rightarrow\tfrac{mL^2}{12}\ \checkmark`, R`Preverba z mejnima primeroma.`]
  ],
  rezultatTex: R`\(J=m\left(\dfrac{L^2}{3}-LD+D^2\right)=\dfrac{mL^2}{12}+m\left(\dfrac L2-D\right)^2\)`,
  opomba: R`Preverjeno simbolno, obe poti se ujemata.`,
  rezultati: [], calc: { mode: 'st', ilustr: true, label: '2025/1 – ilustrativno: m = 1 kg, L = 1 m, D = 0,2 m', vals: { m: '1 kg', L: '1 m', D: '0,2 m', m1: '', R: '' }, g: null } },

{ id: '2025/2', leto: 2025, st: 2, tip: 'vrtilna', simbolna: true, uradno: null, g: null, svg: 'svgStolZgoraj',
  besedilo: R`Študent se vrti na vrtljivem stolu in ima v roki dve uteži (glejte sliko). Stopala študenta so na cevi, ki je pritrjena na sedišče stola in se vrti skupaj s stolom. Študenta zavrtimo, ko ima roke z utežmi iztegnjene, tako kot prikazuje slika. Potem študent pokrči obe roki in jih potegne k telesu. Posledično se spremeni kotna hitrost vrtenja študenta (skupaj s stolom in utežmi). Ali se kotna hitrost poveča ali zmanjša? Odgovor argumentirajte z ustreznimi enačbami in spremljajočim tekstom (brez ustrezne utemeljitve z enačbami in spremljajočega teksta dobite za odgovor nič točk tudi v primeru, če je odgovor pravilen). Trenje v ležaju stola zanemarimo.`,
  podatkiTab: [[R`r_2\lt r_1`, 'uteži se približajo osi'], [R`M_{zun}=0`, 'trenje v ležaju zanemarimo']],
  prviKorak: R`\(M_{zun}=0\Rightarrow\Gamma\) konst.`,
  vzorcni: true,
  koraki: [
    [R`\text{sistem: študent + stol + cev + uteži}`, R`Os vrtenja je navpična skozi stol.`],
    [R`\dfrac{d\Gamma}{dt}=M_{zun}=0\ \Rightarrow\ \Gamma=J\omega=\text{konst.}`, R`Izrek o vrtilni količini. Trenje v ležaju zanemarimo, teža in sila podlage nimata navora okoli navpične osi.`],
    [R`J=\sum m_ir_i^2,\quad J_u=2m_ur^2\ \Rightarrow\ J_2\lt J_1`, R`Ko študent potegne uteži k telesu, se \(r\) zmanjša.`],
    [R`J_1\omega_1=J_2\omega_2\ \Rightarrow\ \omega_2=\omega_1\dfrac{J_1}{J_2}>\omega_1`, R`Iz ohranitve \(\Gamma\).`]
  ],
  rezultatTex: R`kotna hitrost se <b>poveča</b>`,
  rezultati: [], calc: { mode: 'vr', ilustr: true, label: '2025/2 – ilustrativno: J₁ = 6 kg m², ω₁ = 2 rad/s, J₂ = 2 kg m²', vals: { J1: '6 kg m^2', G1: '', w1: '2 rad/s', J2: '2 kg m^2', w2: '' }, g: null } },

  podatkiTab: [[R`m_1=2\,\mathrm{kg}`, 'spodnja klada'], [R`m_2=5\,\mathrm{kg}`, 'zgornja klada'], [R`F=70\,\mathrm{N}`, 'vzporedno s klancem, na zgornjo klado'], [R`\alpha=30^\circ`, ''], [R`k=0{,}2`, 'koeficient trenja'], [R`g=9{,}81\,\mathrm{m/s^2}`, 'ni podan → formular']],
  prviKorak: R`Sile na vsako klado, \(F_n=mg\cos\alpha\).`,

    [R`F_{n,i}=m_ig\cos\alpha\ \Rightarrow\ F_{t,i}=k\,m_ig\cos\alpha`, R`Pravokotno na klanec ni pospeška.`],
    [R`F-(m_1+m_2)g\sin\alpha-k(m_1+m_2)g\cos\alpha=(m_1+m_2)a`, R`Sistem (obe kladi): napetost vrvice deluje na obe kladi nasprotno, zato se v sistemu odšteje.`],
    [R`a=\dfrac{70-7\cdot9{,}81\,(0{,}5+0{,}2\cdot0{,}866)}{7}=\dfrac{70-46{,}23}{7}=3{,}40\,\mathrm{m/s^2}`, R`\(a>0\), torej se res gibljeta navzgor.`],

    [R`T=\dfrac{m_1}{m_1+m_2}F=\dfrac{2}{7}\cdot70=20{,}0\,\mathrm{N}`, R`Vstavimo \(a\) iz koraka 2: členi s \(\sin\) in \(\cos\) se pokrajšajo, \(T\) je neodvisen od \(\alpha\), \(k\) in \(g\) (dobra kontrola!).`]
  ],
  rezultatTex: R`\(T=20{,}0\,\mathrm{N}\), \(a=3{,}40\,\mathrm{m/s^2}\) (z \(g=9{,}8\): \(3{,}40\,\mathrm{m/s^2}\))`,
  rezultati: [

  calc: { mode: 'kl_kladi', vals: { m1: '2 kg', m2: '5 kg', F: '70 N', al: '30°', k: '0,2' }, g: 9.81 } },

{ id: 'vrtilna', ime: 'Ohranitev vrtilne količine (vrtljivi stol)', kratko: 'Vrtilna količina', n: 2, naloge: ['2023/1', '2025/2'],

/* =========================================================

   ========================================================= */
// izhod: {k, lab, f (simbolno), n (s številkami), val (SI), dim, u (TeX enota), deg:bool, sig}
const o = (k, lab, f, n, val, dim, u, extra = {}) => Object.assign({ k, lab, f, n, val, dim, u }, extra);
const dg = (rad) => fmtIn(rad / DEG) + '^\\circ';
const MODES = {
  /* ---------- met ---------- */
  met_pos: { tip: 'met', ime: 'Poševni met – domet', usesG: true,
    inputs: [{ k: 'v0', lab: R`v_0`, dim: 'hitrost', ph: '50 m/s' }, { k: 'phi', lab: R`\varphi`, dim: 'kot', ph: '30°' }],
    compute(V, g) {
      const { v0, phi } = V, s = Math.sin(phi);
      if (!(v0 > 0) || !(phi > 0 && phi < Math.PI / 2)) return { err: R`Potrebujem \(v_0>0\) in \(0^\circ\lt \varphi\lt 90^\circ\).` };
      return { outs: [
        o('tp', R`t_p`, R`\dfrac{2v_0\sin\varphi}{g}`, R`\dfrac{2\cdot ${fmtIn(v0)}\cdot\sin ${dg(phi)}}{${fmtIn(g)}}`, 2 * v0 * s / g, 'cas', 's'),
        o('D', R`D`, R`\dfrac{v_0^2}{g}\sin(2\varphi)`, R`\dfrac{${fmtIn(v0)}^2}{${fmtIn(g)}}\sin(2\cdot ${dg(phi)})`, v0 * v0 * Math.sin(2 * phi) / g, 'dolzina', 'm'),
        o('hmax', R`h_{max}`, R`\dfrac{v_0^2\sin^2\varphi}{2g}`, R`\dfrac{${fmtIn(v0)}^2\sin^2 ${dg(phi)}}{2\cdot ${fmtIn(g)}}`, v0 * v0 * s * s / (2 * g), 'dolzina', 'm')] };

  met_vod: { tip: 'met', ime: 'Vodoravni met s višine', usesG: true,
    inputs: [{ k: 'h', lab: R`h`, dim: 'dolzina', ph: '20 m' }, { k: 'v0', lab: R`v_0`, dim: 'hitrost', ph: '15 m/s' }],
    compute(V, g) {
      const { h, v0 } = V;
      if (!(h > 0) || !(v0 >= 0)) return { err: R`Potrebujem \(h>0\) in \(v_0\ge 0\).` };
      const tp = Math.sqrt(2 * h / g), vy = -g * tp, v = Math.hypot(v0, vy), b = Math.atan2(Math.abs(vy), v0);
      return { outs: [
        o('tp', R`t_p`, R`\sqrt{\dfrac{2h}{g}}`, R`\sqrt{\dfrac{2\cdot ${fmtIn(h)}}{${fmtIn(g)}}}`, tp, 'cas', 's'),
        o('D', R`D`, R`v_0t_p`, R`${fmtIn(v0)}\cdot ${fmtIn(tp)}`, v0 * tp, 'dolzina', 'm'),
        o('vy', R`v_y`, R`-gt_p`, R`-${fmtIn(g)}\cdot ${fmtIn(tp)}`, vy, 'hitrost', 'm/s'),
        o('v', R`v`, R`\sqrt{v_0^2+v_y^2}`, R`\sqrt{${fmtIn(v0)}^2+${fmtIn(Math.abs(vy))}^2}`, v, 'hitrost', 'm/s'),
        o('beta', R`\beta`, R`\arctan\dfrac{|v_y|}{v_0}`, R`\arctan\dfrac{${fmtIn(Math.abs(vy))}}{${fmtIn(v0)}}`, b, 'kot', '', { deg: true, note: 'pod vodoravnico' })] };
    } },
  met_stena: { tip: 'met', ime: 'Met proti steni', usesG: true,
    inputs: [{ k: 'v0', lab: R`v_0`, dim: 'hitrost', ph: '20 m/s' }, { k: 'phi', lab: R`\varphi`, dim: 'kot', ph: '40°' }, { k: 'd', lab: R`d`, dim: 'dolzina', ph: '15 m' }],
    compute(V, g) {
      const { v0, phi, d } = V;
      if (!(v0 > 0) || !(phi > -Math.PI / 2 && phi < Math.PI / 2) || !(d > 0)) return { err: R`Potrebujem \(v_0>0\), \(d>0\) in \(|\varphi|\lt 90^\circ\).` };
      const vx = v0 * Math.cos(phi), v0y = v0 * Math.sin(phi), t = d / vx, y = v0y * t - g * t * t / 2, vy = v0y - g * t, v = Math.hypot(vx, vy), b = Math.atan(vy / vx);
      const res = { outs: [
        o('t', R`t`, R`\dfrac{d}{v_0\cos\varphi}`, R`\dfrac{${fmtIn(d)}}{${fmtIn(v0)}\cos ${dg(phi)}}`, t, 'cas', 's'),
        o('y', R`y`, R`v_0\sin\varphi\,t-\dfrac{gt^2}{2}`, R`${fmtIn(v0)}\sin ${dg(phi)}\cdot ${fmtIn(t)}-\dfrac{${fmtIn(g)}\cdot ${fmtIn(t)}^2}{2}`, y, 'dolzina', 'm'),
        o('vy', R`v_y`, R`v_0\sin\varphi-gt`, R`${fmtIn(v0y)}-${fmtIn(g)}\cdot ${fmtIn(t)}`, vy, 'hitrost', 'm/s', { note: vy > 0 ? 'še se dviga' : (vy < 0 ? 'že pada' : 'na vrhu') }),
        o('v', R`v`, R`\sqrt{v_x^2+v_y^2}`, R`\sqrt{${fmtIn(vx)}^2+${fmtIn(vy)}^2}`, v, 'hitrost', 'm/s'),
        o('beta', R`\beta`, R`\arctan\dfrac{v_y}{v_x}`, R`\arctan\dfrac{${fmtIn(vy)}}{${fmtIn(vx)}}`, b, 'kot', '', { deg: true, note: b >= 0 ? 'nad vodoravnico' : 'pod vodoravnico' })] };
      if (y < 0) res.warn = R`Pozor: \(y\lt 0\) – kamen pade na tla, preden doseže steno (\(D\lt d\)), če sta točka meta in tla na isti višini.`;
      return res;
    } },
  /* ---------- premo ---------- */
  pr_navp: { tip: 'premo', ime: 'Navpični met', usesG: true,
    inputs: [{ k: 'v0', lab: R`v_0`, dim: 'hitrost', ph: '15 m/s' }, { k: 't', lab: R`t\ \text{(poljuben trenutek)}`, dim: 'cas', ph: '1 s' }],
    compute(V, g) {
      const { v0, t } = V;
      if (!(v0 > 0)) return { err: R`Potrebujem \(v_0>0\).` };
      const td = v0 / g, h = v0 * v0 / (2 * g), tp = 2 * v0 / g;
      const outs = [
        o('td', R`t_d`, R`\dfrac{v_0}{g}`, R`\dfrac{${fmtIn(v0)}}{${fmtIn(g)}}`, td, 'cas', 's'),
        o('h', R`h`, R`\dfrac{v_0^2}{2g}`, R`\dfrac{${fmtIn(v0)}^2}{2\cdot ${fmtIn(g)}}`, h, 'dolzina', 'm'),
        o('tp', R`t_p`, R`\dfrac{2v_0}{g}`, R`\dfrac{2\cdot ${fmtIn(v0)}}{${fmtIn(g)}}`, tp, 'cas', 's')];
      if (t != null && t >= 0) {
        const yt = v0 * t - g * t * t / 2, vt = v0 - g * t;
        outs.push(o('yt', R`y(t)`, R`v_0t-\dfrac{gt^2}{2}`, R`${fmtIn(v0)}\cdot ${fmtIn(t)}-\dfrac{${fmtIn(g)}\cdot ${fmtIn(t)}^2}{2}`, yt, 'dolzina', 'm', { note: yt < 0 ? 'kamen je že na tleh (formula velja le do t_p)' : '' }));
        outs.push(o('vt', R`v(t)`, R`v_0-gt`, R`${fmtIn(v0)}-${fmtIn(g)}\cdot ${fmtIn(t)}`, vt, 'hitrost', 'm/s', { note: Math.abs(vt) < 1e-9 ? 'na vrhu' : (vt > 0 ? 'dviga se' : 'pada') }));
      }
      return { outs };
    } },
  pr_del: { tip: 'premo', ime: 'Del poti iz mirovanja', usesG: false,
    inputs: [{ k: 'a', lab: R`a`, dim: 'pospesek', ph: '1 m/s^2' }, { k: 's', lab: R`s`, dim: 'dolzina', ph: '100 m' }, { k: 'ds', lab: R`\Delta s\ \text{(zadnji del)}`, dim: 'dolzina', ph: '10 m' }],
    compute(V) {
      const { a, s, ds } = V;
      if (!(a > 0) || !(s > 0) || !(ds > 0 && ds <= s)) return { err: R`Potrebujem \(a>0\), \(s>0\) in \(0\lt \Delta s\le s\).` };
      const t1 = Math.sqrt(2 * s / a), t2 = Math.sqrt(2 * (s - ds) / a);
      return { outs: [
        o('ts', R`t_s`, R`\sqrt{\dfrac{2s}{a}}`, R`\sqrt{\dfrac{2\cdot ${fmtIn(s)}}{${fmtIn(a)}}}`, t1, 'cas', 's'),
        o('ts2', R`t_{s-\Delta s}`, R`\sqrt{\dfrac{2(s-\Delta s)}{a}}`, R`\sqrt{\dfrac{2\cdot ${fmtIn(s - ds)}}{${fmtIn(a)}}}`, t2, 'cas', 's'),
        o('dt', R`\Delta t`, R`t_s-t_{s-\Delta s}`, R`${fmtIn(t1)}-${fmtIn(t2)}`, t1 - t2, 'cas', 's')] };
    } },
  /* ---------- gravitacija ---------- */
  gr_planet: { tip: 'grav', ime: R`g na drugem planetu / višini`, imeTex: R`\(g\) na drugem planetu / višini`, usesG: false, gField: 'g0',
    inputs: [{ k: 'g0', lab: R`g_0`, dim: 'pospesek', ph: '9,8 m/s^2' }, { k: 'R', lab: R`R`, dim: 'dolzina', ph: '6400 km' }, { k: 'Rp', lab: R`R'\ \text{(polmer planeta) ali}`, dim: 'dolzina', ph: '100 km', opt: true }, { k: 'h', lab: R`h\ \text{(višina)}`, dim: 'dolzina', ph: '', opt: true }],
    compute(V) {
      const { g0, R: Rz, Rp, h } = V;
      if (!(g0 > 0) || !(Rz > 0)) return { err: R`Potrebujem \(g_0\) in \(R\).` };
      if (Rp != null && Rp > 0) {
        const gp = g0 * (Rz / Rp) ** 2;
        return { outs: [
          o('gp', R`g'`, R`g_0\left(\dfrac{R}{R'}\right)^2`, R`${fmtIn(g0)}\cdot\left(\dfrac{${fmtIn(Rz)}}{${fmtIn(Rp)}}\right)^2`, gp, 'pospesek', 'm/s^2'),
          o('ratio', R`g'/g_0`, R`\left(\dfrac{R}{R'}\right)^2`, R`\left(\dfrac{${fmtIn(Rz)}}{${fmtIn(Rp)}}\right)^2`, gp / g0, 'brez', '', { sig: 4 })] };
      }
      if (h != null && h >= 0) {
        const gh = g0 * Rz * Rz / (Rz + h) ** 2;
        return { outs: [
          o('gp', R`g(h)`, R`g_0\dfrac{R^2}{(R+h)^2}`, R`${fmtIn(g0)}\cdot\dfrac{(${fmtIn(Rz)})^2}{(${fmtIn(Rz)}+${fmtIn(h)})^2}`, gh, 'pospesek', 'm/s^2'),
          o('ratio', R`g(h)/g_0`, R`\dfrac{R^2}{(R+h)^2}`, R`\dfrac{(${fmtIn(Rz)})^2}{(${fmtIn(Rz + h)})^2}`, gh / g0, 'brez', '')] };
      }
      return { err: R`Vpiši \(R'\) <b>ali</b> \(h\).` };
    } },
  gr_sat: { tip: 'grav', ime: 'Satelit', usesG: false, gField: 'g0',
    inputs: [{ k: 'v', lab: R`v\ \text{ali}`, dim: 'hitrost', ph: '3 km/s', opt: true }, { k: 'h', lab: R`h`, dim: 'dolzina', ph: '', opt: true }, { k: 'R', lab: R`R`, dim: 'dolzina', ph: '6400 km' }, { k: 'g0', lab: R`g_0`, dim: 'pospesek', ph: '9,8 m/s^2' }],
    compute(V) {
      const { v, h, R: Rz, g0 } = V;
      if (!(g0 > 0) || !(Rz > 0)) return { err: R`Potrebujem \(g_0\) in \(R\).` };
      if (v != null && v > 0) {
        const Rh = g0 * Rz * Rz / (v * v), hh = Rh - Rz, t0 = 2 * Math.PI * Rh / v;
        const r = { outs: [
          o('Rh', R`R+h`, R`\dfrac{g_0R^2}{v^2}`, R`\dfrac{${fmtIn(g0)}\cdot(${fmtIn(Rz)})^2}{(${fmtIn(v)})^2}`, Rh, 'dolzina', 'm'),
          o('h', R`h`, R`(R+h)-R`, R`${fmtIn(Rh)}-${fmtIn(Rz)}`, hh, 'dolzina', 'm'),
          o('t0', R`t_0`, R`\dfrac{2\pi(R+h)}{v}`, R`\dfrac{2\pi\cdot ${fmtIn(Rh)}}{${fmtIn(v)}}`, t0, 'cas', 's', { note: '= ' + fmtPlain(t0 / 3600) + ' h' })] };
        if (hh < 0) r.warn = R`\(h\lt 0\): s to hitrostjo satelit ne more krožiti nad površjem (prehiter za ta tir je nemogoč – potreboval bi \(R+h\lt R\)).`;
        return r;
      }
      if (h != null && h >= 0) {
        const vv = Math.sqrt(g0 * Rz * Rz / (Rz + h)), t0 = 2 * Math.PI * (Rz + h) / vv;
        return { outs: [
          o('v', R`v`, R`\sqrt{\dfrac{g_0R^2}{R+h}}`, R`\sqrt{\dfrac{${fmtIn(g0)}\cdot(${fmtIn(Rz)})^2}{${fmtIn(Rz + h)}}}`, vv, 'hitrost', 'm/s'),
          o('t0', R`t_0`, R`\dfrac{2\pi(R+h)}{v}`, R`\dfrac{2\pi\cdot ${fmtIn(Rz + h)}}{${fmtIn(vv)}}`, t0, 'cas', 's', { note: '= ' + fmtPlain(t0 / 3600) + ' h' })] };
      }
      return { err: R`Vpiši \(v\) <b>ali</b> \(h\).` };
    } },
  /* ---------- klanec ---------- */
  kl_mejni: { tip: 'klanec', ime: 'Mejni kot ↔ koeficient lepenja', usesG: false,
    inputs: [{ k: 'am', lab: R`\alpha_m\ \text{ali}`, dim: 'kot', ph: '25°', opt: true }, { k: 'kl', lab: R`k_l`, dim: 'brez', ph: '', opt: true }],
    compute(V) {
      const { am, kl } = V;

      if (kl != null && kl > 0) return { outs: [o('am', R`\alpha_m`, R`\arctan k_l`, R`\arctan ${fmtIn(kl)}`, Math.atan(kl), 'kot', '', { deg: true })] };

  kl_kladi: { tip: 'klanec', ime: 'Dve kladi na klancu z vlečno silo', usesG: true,
    inputs: [{ k: 'm1', lab: R`m_1\ \text{(spodnja)}`, dim: 'masa', ph: '2 kg' }, { k: 'm2', lab: R`m_2\ \text{(zgornja)}`, dim: 'masa', ph: '5 kg' }, { k: 'F', lab: R`F`, dim: 'sila', ph: '70 N' }, { k: 'al', lab: R`\alpha`, dim: 'kot', ph: '30°' }, { k: 'k', lab: R`k\ \text{(trenje)}`, dim: 'brez', ph: '0,2' }],
    compute(V, g) {
      const { m1, m2, F, al, k } = V;
      if (!(m1 > 0 && m2 > 0) || F == null || al == null || k == null) return { err: 'Izpolni vsa polja.' };
      const M = m1 + m2, s = Math.sin(al), c = Math.cos(al);

        o('T', R`T`, R`\dfrac{m_1}{m_1+m_2}F`, R`\dfrac{${fmtIn(m1)}}{${fmtIn(M)}}\cdot ${fmtIn(F)}`, T, 'sila', 'N')] };
      if (a <= 0) r.warn = 'Sila je premajhna, sistem miruje – računaj z lepenjem (zgornji rezultati tedaj ne veljajo).';

    } },
  /* ---------- trki ---------- */
  tr_trk: { tip: 'trki', ime: 'Trk', usesG: false,
    inputs: [{ k: 'm1', lab: R`m_1`, dim: 'masa', ph: '2 kg' }, { k: 'v1', lab: R`v_1\ \text{(s predznakom)}`, dim: 'hitrost', ph: '15 m/s' }, { k: 'm2', lab: R`m_2`, dim: 'masa', ph: '1 kg' }, { k: 'v2', lab: R`v_2\ \text{(s predznakom)}`, dim: 'hitrost', ph: '0 m/s' },

    compute(V) {
      const { m1, v1, m2, v2, vrsta } = V;
      if (!(m1 > 0 && m2 > 0) || v1 == null || v2 == null) return { err: 'Izpolni mase in hitrosti.' };
      const M = m1 + m2, W0 = m1 * v1 * v1 / 2 + m2 * v2 * v2 / 2;

const MODES_BY_TIP = {};
for (const [id, m] of Object.entries(MODES)) { m.id = id; (MODES_BY_TIP[m.tip] = MODES_BY_TIP[m.tip] || []).push(id); }

function fmtOut(x) { return (x.deg ? fmtN(x.val / DEG, x.sig || 3) + '^\\circ' : fmtN(x.val, x.sig || 3) + unitTex(x.u)); }

// izračun načina iz nizov (za teste in simulacijo)
function computeFromStrings(modeId, vals, g) {
  const M = MODES[modeId], V = {};
  for (const inp of M.inputs) {
    const s = vals[inp.k];
    if (inp.sel) { V[inp.k] = s || inp.sel[0][0]; continue; }
    if (s == null || String(s).trim() === '') { V[inp.k] = null; continue; }
    const p = parseQty(s, inp.dim);
    if (!p.ok) return { err: inp.k + ': ' + p.msg };
    V[inp.k] = p.si;
  }
  return M.compute(V, g);
}
function otherG(g) { return Math.abs(g - 9.8) < 1e-9 ? 9.81 : (Math.abs(g - 9.81) < 1e-9 ? 9.8 : null); }
// vrednost z drugim g (za »razlika samo zaradi g«)
function altValue(modeId, vals, g, k) {
  const M = MODES[modeId];
  let r;
  if (M.gField) {
    const p = parseQty(vals[M.gField] || '', 'pospesek'); if (!p.ok) return null;
    const og = otherG(p.si); if (og == null) return null;
    r = computeFromStrings(modeId, Object.assign({}, vals, { [M.gField]: String(og) + ' m/s^2' }), og);
  } else if (M.usesG) {
    const og = otherG(g); if (og == null) return null;
    r = computeFromStrings(modeId, vals, og);
  } else return null;
  const x = r && r.outs && r.outs.find(q => q.k === k);
  return x ? x.val : null;
}

/* ---- UI kalkulatorja ---- */
const CALC = {}; // stanje po tipih: {mode, vals:{mode:{k:str}}, g}
function calcLoads(tipId) {
  const L = [];
  for (const n of NALOGE) {
    if (n.tip !== tipId || !n.calc) continue;
    L.push({ id: n.id, label: n.calc.label || (n.id + ' – podatki s kolokvija'), mode: n.calc.mode, vals: n.calc.vals, g: n.calc.g, ilustr: !!n.calc.ilustr });
    if (n.calc.extra) L.push({ id: n.id + '+', label: n.id + ' – ustavljanje po trku (v = 10 m/s iz prvega dela)', mode: n.calc.extra.mode, vals: n.calc.extra.vals, g: n.calc.extra.g, ilustr: false });
  }
  for (const e of (TIP[tipId].extraLoads || [])) L.push(Object.assign({ id: 'x' + L.length }, e));
  return L;
}
function calcState(tipId) {
  if (!CALC[tipId]) {
    const modes = MODES_BY_TIP[tipId];
    CALC[tipId] = { mode: modes[0], vals: {}, g: CONST.g, ilustr: false };
  }
  return CALC[tipId];
}
function calcHTML(tipId) {

  if (st.ilustr) h += '<div class="note">števila so ilustrativna (simbolna naloga)</div>';

  }

function bindCalc(root, tipId) {
  const st = calcState(tipId);
  const box = $('#calc', root);

  const vals = st.vals[st.mode] = st.vals[st.mode] || {};
  const rerender = () => { box.outerHTML = calcHTML(tipId); const nb = $('#calc', root); renderMath(nb); bindCalc(root, tipId); };
  $$('.tabs button', box).forEach(b => b.onclick = () => { st.mode = b.dataset.mode; st.ilustr = false; rerender(); });
  $$('.seg button', box).forEach(b => b.onclick = () => {
    const gv = parseFloat(b.dataset.g);
    if (M.gField) vals[M.gField] = String(gv).replace('.', ',') + ' m/s^2'; else st.g = gv;
    rerender(); if (box.dataset.ran) $('#calcGo', root).click();
  });

    const L = calcLoads(tipId)[+$('#calcLoadSel', box).value];

    const upd = () => {
      vals[inp.dataset.k] = inp.value;
      const cv = inp.nextElementSibling;
      if (!inp.value.trim()) { cv.innerHTML = ''; cv.classList.remove('err'); return; }
      const p = parseQty(inp.value, inp.dataset.dim);
      cv.classList.toggle('err', !p.ok);
      cv.innerHTML = p.ok ? convTex(p, inp.dataset.dim) : esc(p.msg);
      renderMath(cv);
    };
    inp.addEventListener('input', upd); upd();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('#calcGo', root).click(); });
  });
  $$('select[data-k]', box).forEach(sel => sel.onchange = () => { vals[sel.dataset.k] = sel.value; });
  let last = null;
  $('#calcGo', box).onclick = () => {
    const out = $('#calcOut', box);
    const gUse = M.gField ? null : st.g;
    const r = computeFromStrings(st.mode, vals, gUse);
    box.dataset.ran = '1';
    if (!r || r.err) { out.innerHTML = '<div class="fb bad">' + (r ? r.err : 'Napaka') + '</div>'; renderMath(out); last = null; fillMy(); return; }
    last = r;

      h += '<div class="outblk"><div class="l">\\(' + x.lab + '=' + x.f + '\\)</div><div class="l">\\(' + x.lab + '=' + x.n + '\\)</div><div class="l"><b>\\(' + x.lab + '=' + fmtOut(x) + '\\)</b>' + (x.note ? ' <span class="small muted">(' + x.note + ')</span>' : '') + '</div></div>';
    }
    out.innerHTML = h; renderMath(out); fillMy();
  };
  const fillMy = () => {
    const sel = $('#myK', box), prev = sel.value;
    sel.innerHTML = last ? last.outs.map(x => '<option value="' + x.k + '">' + esc(x.lab.replace(/\\[a-zA-Z]+/g, m => ({ '\\beta': 'β', '\\alpha': 'α', '\\Gamma': 'Γ', '\\omega': 'ω', '\\Delta': 'Δ', '\\varphi': 'φ', '\\mathrm': '', '\\sqrt': '√' }[m] ?? '')).replace(/[{}\\]/g, '').replace(/\s+/g, ' ')) + '</option>').join('') : '<option value="">najprej »Izračunaj«</option>';
    if (prev && last && last.outs.some(x => x.k === prev)) sel.value = prev;
  };
  fillMy();
  $('#myGo', box).onclick = () => {
    const fb = $('#myFb', box);
    if (!last) { $('#calcGo', box).click(); }
    if (!last) { fb.innerHTML = '<div class="fb bad">Najprej izpolni podatke in klikni »Izračunaj«.</div>'; return; }
    const k = $('#myK', box).value, x = last.outs.find(q => q.k === k);
    const alt = altValue(st.mode, vals, M.gField ? null : st.g, k);
    const r = checkResult($('#myV', box).value, x.dim, x.val, alt);
    fb.innerHTML = '<div class="fb ' + r.cls + '">' + r.msg + (r.wrong ? ' <button class="small" id="myShow">Pokaži</button>' : '') + '</div>';
    renderMath(fb);
    const sb = $('#myShow', fb);
    if (sb) sb.onclick = () => { sb.outerHTML = '<span>pravilno: \\(' + fmtOut(x) + '\\)</span>'; renderMath(fb); };
  };
  $('#myV', box).addEventListener('keydown', e => { if (e.key === 'Enter') $('#myGo', box).click(); });
}
function loadCalc(root, tipId, L) {
  const st = calcState(tipId);

  ['2022/2', 'vz_naprej', { alpha: 11.523177 * DEG, T: 1.0011798 }]

function runCalcTests() {
  const res = [];
  for (const [id, mode, exp] of CALC_EXPECT) {
    const n = NAL[id.replace('+', '')];
    const c = id.endsWith('+') ? n.calc.extra : n.calc;
    const r = computeFromStrings(mode, c.vals, c.g);
    for (const [k, v] of Object.entries(exp)) {
      const x = r.outs && r.outs.find(q => q.k === k);
      const got = x ? x.val : NaN;
      const tol = Math.abs(v) < 1e-9 ? 1e-9 : Math.abs(v) * 2e-4;
      const shown = x ? fmtOut(x) : '—';
      res.push({ name: id + ' ' + k, exp: v, got, shown, pass: Math.abs(got - v) <= tol });
    }
  }
  // rezultati NALOGE (sim) == kalkulator
  for (const n of NALOGE) {
    if (!n.calc || n.calc.ilustr) continue;
    for (const rz of n.rezultati) {
      let r = computeFromStrings(n.calc.mode, n.calc.vals, n.calc.g), x = r.outs && r.outs.find(q => q.k === rz.k);
      if (!x && n.calc.extra) { r = computeFromStrings(n.calc.extra.mode, n.calc.extra.vals, n.calc.extra.g); x = r.outs && r.outs.find(q => q.k === rz.k); }
      const got = x ? x.val : NaN;
      res.push({ name: n.id + ' NALOGE.' + rz.k, exp: rz.vrednost, got, shown: x ? fmtOut(x) : '—', pass: Math.abs(got - rz.vrednost) <= Math.abs(rz.vrednost) * 2e-4 });
    }
  }
  return res;
}

  let h = '<div class="ex" id="' + exId(n.id) + '">';
  h += '<h3 style="margin-top:0">Kolokvij ' + n.id.replace('/', ', naloga ') + ' <span class="badge cnt">' + vrsta + '</span></h3>';
  h += '<blockquote>' + n.besedilo + '</blockquote>';
  h += podatkiHTML(n);
  h += drawSvg(n.svg, n.svg === 'svgMetTiri');
  if (n.slikaOpomba) h += '<div class="small muted" style="text-align:center">' + n.slikaOpomba + '</div>';
  if (n.calc) h += '<div class="row"><button data-try="' + n.id + '">Najprej poskusi sam → kalkulator</button></div>';
  h += '<div class="steps">';
  if (n.vzorcni) h += '<div class="small muted">Vzorčni odgovor – tako bi zapisal na kolokviju:</div>';
  n.koraki.forEach((k, i) => { h += '<div class="step" style="display:none"><div><b>' + (i + 1) + '.</b> \\[' + k[0] + '\\]</div><div class="why"><b>Zakaj:</b> ' + k[1] + '</div></div>'; });
  h += '<div class="result" style="display:none"><b>Rezultat:</b> ' + n.rezultatTex + '<div style="margin-top:6px">' + NEURADNO + '</div>' + (n.opomba ? '<div class="small" style="margin-top:6px">' + n.opomba + '</div>' : '') + '</div>';
  if (n.predpostavka) h += '<div class="note res2" style="display:none"><b>Predpostavka:</b> ' + n.predpostavka + '</div>';
  if (n.svg !== 'svgMetTiri') h += '<div class="res2" style="display:none"><div class="small muted" style="text-align:center;margin-top:8px">Skica z rešitvijo:</div>' + drawSvg(n.svg, true) + '</div>';
  h += '</div><div class="row stepbtns"><button class="primary" data-next>Naslednji korak</button><button data-all>Pokaži vse</button><span class="small muted stepcnt"></span></div>';
  h += '</div>';
  return h;
}
function bindEx(root) {
  $$('.ex', root).forEach(ex => {
    const steps = $$('.step', ex), res = $$('.result, .res2', ex), cnt = $('.stepcnt', ex);
    let shown = 0;
    const upd = () => {
      steps.forEach((s, i) => s.style.display = i < shown ? '' : 'none');
      const done = shown >= steps.length;
      res.forEach(r => r.style.display = done ? '' : 'none');
      if (cnt) cnt.textContent = done ? 'vse prikazano' : (shown + '/' + steps.length + ' korakov');
      const nb = $('[data-next]', ex); if (nb) nb.disabled = done;
      const ab = $('[data-all]', ex); if (ab) ab.textContent = done ? 'Skrij rešitev' : 'Pokaži vse';
    };
    const nb = $('[data-next]', ex), ab = $('[data-all]', ex);
    if (nb) nb.onclick = () => { shown = Math.min(steps.length, shown + 1); upd(); };
    if (ab) ab.onclick = () => { shown = shown >= steps.length ? 0 : steps.length; upd(); };
    upd();
  });
}

function bindTip(root, id, anchor) {
  $('#znam', root).onchange = (e) => { S.znam[id] = e.target.checked; if (!e.target.checked) delete S.znam[id]; save(); buildNav('tip-' + id); };
  bindEx(root);
  bindCalc(root, id);
  const jump = (nid) => {
    const det = $('#det-' + exId(nid), root); if (det) det.open = true;
    const el = $('#' + exId(nid), root); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  $$('[data-chip]', root).forEach(b => b.onclick = () => jump(b.dataset.chip));
  $$('[data-try]', root).forEach(b => b.onclick = () => {
    const n = NAL[b.dataset.try], L = calcLoads(id).find(l => l.id === n.id);
    if (L) loadCalc(root, id, L);
    $('#calc', root).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const avd = () => {
    const list = (S.avd[id] = S.avd[id] || []);
    $('#avdList', root).innerHTML = list.length ? list.map((v, i) => '<li><b>' + esc(v.st) + '</b> – ' + esc(v.opis) + ' <button class="small" data-del="' + i + '" aria-label="Odstrani">✕</button></li>').join('') : '<li class="muted">Še ni vnosov.</li>';
    $$('[data-del]', root).forEach(b => b.onclick = () => { list.splice(+b.dataset.del, 1); save(); avd(); });
  };
  $('#avdAdd', root).onclick = () => {
    const st = $('#avdSt', root).value.trim(), op = $('#avdOpis', root).value.trim();
    if (!st && !op) return;
    (S.avd[id] = S.avd[id] || []).push({ st, opis: op }); save();
    $('#avdSt', root).value = ''; $('#avdOpis', root).value = ''; avd();
  };
  avd();
  if (anchor) setTimeout(() => jump(anchor), 50);

let Q = null;
function newQuiz() { Q = { order: shuffle(NALOGE.map(n => n.id)), i: 0, ans: {}, done: false }; }
function pageKviz() {
  if (!Q) newQuiz();
  let h = '<h1>Preveri se: prepoznaj tip</h1><p class="meta">Vseh 16 nalog s kolokvijev v naključnem vrstnem redu. Izberi tip naloge.</p><div id="quiz"></div>';
  return h;
}
function drawQuiz(root) {
  const box = $('#quiz', root);
  if (Q.done) {
    const ok = Q.order.filter(id => Q.ans[id] === NAL[id].tip).length, miss = Q.order.filter(id => Q.ans[id] !== NAL[id].tip);
    let h = '<div class="card"><h2 style="margin-top:0">Rezultat: ' + ok + '/16</h2>';
    if (miss.length) h += '<p>Zgrešene naloge:</p><ul class="lst">' + miss.map(id => '<li><a href="#tip-' + NAL[id].tip + ':' + id + '">' + id + '</a> – pravilno: ' + tipIme(TIP[NAL[id].tip]) + ' (tvoj odgovor: ' + tipIme(TIP[Q.ans[id]]) + ')</li>').join('') + '</ul>';
    else h += '<p>Vse pravilno! 🎉</p>';
    h += '<button class="primary" id="qAgain">Znova</button></div>';
    h += '<h3>Zadnji rezultati</h3>' + (S.kviz.length ? '<ul class="lst">' + S.kviz.slice().reverse().map(r => '<li>' + r.datum + ': <b>' + r.ok + '/16</b></li>').join('') + '</ul>' : '<p class="muted">Še ni rezultatov.</p>');
    box.innerHTML = h; renderMath(box);
    $('#qAgain', box).onclick = () => { newQuiz(); drawQuiz(root); };
    return;
  }
  const id = Q.order[Q.i], n = NAL[id], a = Q.ans[id];
  let h = '<div class="card"><div class="row" style="justify-content:space-between"><b>Naloga ' + (Q.i + 1) + '/16</b><span class="small muted">pravilnih do zdaj: ' + Q.order.slice(0, Q.i).filter(x => Q.ans[x] === NAL[x].tip).length + '</span></div>';
  h += '<blockquote style="margin:10px 0;padding:8px 14px;border-left:4px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0">' + n.besedilo + '</blockquote>';
  h += drawSvg(n.svg, n.svg === 'svgMetTiri' ? true : false);
  h += '<div class="qtypes">' + TIPI.map((t, i) => {
    let cls = '';
    if (a) { if (t.id === n.tip) cls = 'right'; else if (t.id === a) cls = 'wrong'; }
    return '<button data-t="' + t.id + '" class="' + cls + '"' + (a ? ' disabled' : '') + '>' + (i + 1) + '. ' + tipIme(t) + '</button>';
  }).join('') + '</div>';
  if (a) {
    const t = TIP[n.tip], ok = a === n.tip;
    h += '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ Pravilno: ' : '✗ Pravilni tip: ') + tipIme(t) + '</div>';
    h += '<p><b>Prvi korak recepta:</b> ' + n.prviKorak + '</p><p>' + fbadge(t.okvir) + '</p>';
    if (!ok) { const nm = namigZa(a, n.tip); if (nm) h += '<div class="note"><b>Razlikovalni namig:</b> ' + nm + '</div>'; }
    h += '<div class="row"><button class="primary" id="qNext">' + (Q.i === 15 ? 'Rezultat' : 'Naslednja naloga →') + '</button><a href="#tip-' + n.tip + '"><button>Odpri stran tipa</button></a></div>';
  }
  h += '</div>';
  box.innerHTML = h; renderMath(box);
  $$('.qtypes button', box).forEach(b => b.onclick = () => { Q.ans[id] = b.dataset.t; drawQuiz(root); });
  const nx = $('#qNext', box);
  if (nx) nx.onclick = () => {
    if (Q.i === 15) {
      Q.done = true;
      const ok = Q.order.filter(x => Q.ans[x] === NAL[x].tip).length;
      S.kviz.push({ datum: new Date().toLocaleString('sl-SI'), ok }); S.kviz = S.kviz.slice(-10); save();
    } else Q.i++;
    drawQuiz(root); box.scrollIntoView({ block: 'start' });
  };
}

/* =========================================================

   ========================================================= */
let SIM = { leto: null, run: false, el: 0, t0: 0, iv: null, vals: {}, self: {}, notes: {}, done: false };
function simLimit() { const m = parseFloat(String(S.moji.trajanje || '').replace(',', '.')); return m > 0 ? m * 60 : null; }
function fmtTime(s) { const neg = s < 0; s = Math.abs(Math.round(s)); const mm = Math.floor(s / 60), ss = s % 60; return (neg ? '−' : '') + mm + ':' + String(ss).padStart(2, '0'); }
function pageSim() {
  let h = '<h1>Simulacija kolokvija</h1><p class="meta">Izberi leto. Prikažejo se vse 4 naloge brez imen tipov. Pri številskih nalogah vpiši rezultat z enoto, pri simbolnih zapiši opombo in se preveri sam.</p>';
  h += '<div class="row">' + [2022, 2023, 2024, 2025].map(y => '<button data-y="' + y + '" class="' + (SIM.leto === y ? 'primary' : '') + '">' + y + '</button>').join('') + '</div><div id="simBox"></div>';
  h += '<h2>Zgodovina</h2>' + (S.sim.length ? '<ul class="lst">' + S.sim.slice().reverse().map(r => '<li>' + r.datum + ' – kolokvij ' + r.leto + ': <b>' + r.ok + '/' + r.vse + '</b> pravilnih, čas ' + r.cas + '</li>').join('') + '</ul>' : '<p class="muted">Še ni simulacij.</p>');
  return h;
}
function simTick(root) {
  const el = SIM.run ? SIM.el + (Date.now() - SIM.t0) / 1000 : SIM.el, lim = simLimit();
  const tEl = $('#simT', root); if (!tEl) { clearInterval(SIM.iv); return; }
  if (lim) {
    const rem = lim - el; tEl.textContent = fmtTime(Math.max(0, rem)); tEl.classList.toggle('late', rem <= 60);
    if (rem <= 0 && SIM.run) { SIM.el = lim; SIM.run = false; clearInterval(SIM.iv); $('#simMsg', root).innerHTML = '<div class="fb bad">⏰ Čas je potekel!</div>'; try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} updTimerBtns(root); }
  } else tEl.textContent = fmtTime(el);
}
function updTimerBtns(root) { const b = $('#simStart', root); if (b) b.textContent = SIM.run ? 'Pavza' : (SIM.el > 0 ? 'Nadaljuj' : 'Start'); }
function drawSim(root) {
  const box = $('#simBox', root);

  const lim = simLimit();

  const tasks = NALOGE.filter(n => n.leto === SIM.leto);
  tasks.forEach(n => {
    h += '<div class="ex"><h3 style="margin-top:0">' + n.st + '. naloga</h3><blockquote>' + n.besedilo + '</blockquote>' + drawSvg(n.svg, n.svg === 'svgMetTiri');

      h += '<div class="fgrid">' + n.rezultati.map(r => '<div class="fld"><label>\\(' + r.label + '\\)</label><input type="text" autocomplete="off" data-sim="' + n.id + '|' + r.k + '" placeholder="npr. ' + esc(DIMS[r.dim].npr) + '" value="' + esc(SIM.vals[n.id + '|' + r.k] || '') + '"></div>').join('') + '</div>';

    }

  $$('[data-self]', box).forEach(i => i.onchange = () => { SIM.self[i.dataset.self] = i.checked; });
  $$('[data-show]', box).forEach(b => b.onclick = () => { const s = $('#sol-' + exId(b.dataset.show), box); s.style.display = s.style.display === 'none' ? '' : 'none'; });

    renderMath($('#simRes', box));
    S.sim.push({ leto: SIM.leto, datum: new Date().toLocaleString('sl-SI'), ok, vse, cas }); S.sim = S.sim.slice(-20); save();
  };
}

];
function mergeB(a, b, txt) { return { id: a.id + '+' + b.id, txt: txt || (a.txt + ' + ' + b.txt), links: a.links.concat(b.links.filter(l => !a.links.some(x => x[0] === l[0]))) }; }
function buildPlan(n) {
  // vrne {days:[block], mode}
  const B = Object.fromEntries(PLAN_BLOCKS.map(b => [b.id, Object.assign({}, b)]));
  if (n == null || n >= 11) return { mode: 'full', days: PLAN_BLOCKS.slice() };
  if (n >= 6) {
    let d1 = n <= 10 ? mergeB(B.b1, B.b2) : B.b1;
    let rest = [];
    rest.push(d1);
    if (n <= 9) rest.push(mergeB(B.b3, B.b4)); else { rest.push(B.b3, B.b4); }
    if (n <= 6) rest.push(mergeB(B.b5, B.b6)); else rest.push(B.b5, B.b6);
    if (n <= 8) {
      rest.push(mergeB(B.b7, { id: 'b8', txt: 'Pospešen voziček', links: [['tip-vozicek', 'Voziček']] }, 'Klanec in trenje + Pospešen voziček'));
      rest.push({ id: 'b9', txt: B.b9.txt + ' + kviz »Prepoznaj tip« (cilj ≥ 14/16)', links: B.b9.links.concat([['kviz', 'Kviz']]) });
    } else { rest.push(B.b7, B.b8, B.b9); }
    if (n >= 8) rest.push(B.b10);
    rest.push(B.b11);
    return { mode: 'skrajsan', days: rest };
  }
  if (n === 5) return { mode: 'nujni', days: [
    { id: 'n1', txt: 'Met v 2D + Premo gibanje + Gravitacija', links: [['tip-met', 'Met'], ['tip-premo', 'Premo'], ['tip-grav', 'Gravitacija']] },
    { id: 'n2', txt: 'Trki + Klanec + Voziček', links: [['tip-trki', 'Trki'], ['tip-klanec', 'Klanec'], ['tip-vozicek', 'Voziček']] },
    { id: 'n3', txt: 'Steinerjev izrek + Vrtilna količina', links: [['tip-steiner', 'Steiner'], ['tip-vrtilna', 'Vrtilna']] },
    { id: 'n4', txt: 'Generalka: simulacija 2025', links: [['sim', 'Simulacija']] },
    { id: 'b11', txt: B.b11.txt, links: B.b11.links }] };
  return { mode: 'dve', days: [
    { id: 'u1', txt: 'Met v 2D (3× na kolokvijih) – rešen primer in kalkulator', links: [['tip-met', 'Met']] },
    { id: 'u2', txt: 'Po en rešen primer vsakega tipa', links: TIPI.filter(t => t.id !== 'met').map(t => ['tip-' + t.id, t.kratko]) },
    { id: 'u3', txt: 'Najpogostejše napake', links: [['napake', 'Napake']] }] };
}
function pagePlan() {
  const ex = parseDateISO(S.moji.datum), today = todayMid();
  let n = null;
  if (ex) n = Math.round((ex - today) / 86400000); // dni od danes do dneva pred kolokvijem, vključno z danes
  let h = '<h1>Plan učenja</h1><div class="card"><div class="row"><div class="fld" style="flex:1;min-width:200px;margin:0"><label for="pDatum">Datum kolokvija (isti podatek kot »Moji podatki«)</label><input type="date" id="pDatum" value="' + esc(S.moji.datum || '') + '"></div></div><p class="small muted" style="margin-bottom:0">Datum kolokvija ni v gradivu. Lani je bil 28. 11. – preveri datum v e-učilnici. Hkrati se učiš za OE I (1. kolokvij predvidoma v začetku decembra), zato je plan ~1 ura na dan.</p></div>';
  h += '<div class="note"><b>Vsak dan:</b> najprej sam reši rešeni primer (rešitev skrita) → preveri s kalkulatorjem (»Moj rezultat«) → šele nato razkrij korake in preberi »Zakaj« → preberi »Pasti« → odkljukaj »Ta tip znam« šele, ko primer rešiš brez pomoči.</div>';
  if (ex && n <= 0) {
    h += '<div class="fb or">Kolokvij je ' + (n === 0 ? 'danes' : 'že mimo') + '.</div>';
  }
  const P = buildPlan(ex ? Math.max(n, 0) : null);
  const title = { full: ex ? 'Polni plan (11 dni)' : 'Polni plan (11 dni) – datum ni vnesen, zato številke dni', skrajsan: 'Skrajšan plan (' + n + ' dni)', nujni: 'Nujni plan (5 dni)', dve: 'Najpomembnejše v 2 urah' }[P.mode];
  h += '<h2>' + title + '</h2>';
  const days = P.days;
  let dates = null;
  if (ex && P.mode !== 'dve') {
    dates = days.map((_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
    const last = new Date(ex); last.setDate(last.getDate() - 1); dates[dates.length - 1] = last;
    if (n > days.length) h += '<p class="small muted">Do kolokvija imaš ' + n + ' dni – ' + (n - days.length) + ' dni ostane za rezervo / ponavljanje šibkih tipov (pred zadnjim dnem).</p>';
  }
  h += '<div class="card">' + days.map((d, i) => {
    const k = (P.mode === 'dve' ? 'u:' : '') + d.id, ch = !!S.plan[k];
    const lbl = dates ? fmtDate(dates[i]) : (P.mode === 'dve' ? (i + 1) + '.' : 'Dan ' + (i + 1));
    return '<div class="planday' + (ch ? ' done' : '') + '"><input type="checkbox" data-pk="' + esc(k) + '"' + (ch ? ' checked' : '') + ' aria-label="opravljeno" style="margin-top:10px"><div class="d" style="padding-top:8px">' + lbl + '</div><div style="flex:1"><div class="txt" style="padding-top:8px">' + d.txt + '</div><div class="row" style="margin-top:4px">' + d.links.map(l => '<a href="#' + l[0] + '"><button class="small">' + l[1] + ' →</button></a>').join('') + '</div></div></div>';
  }).join('') + '</div>';
  return h;
}
function bindPlan(root) {
  $('#pDatum', root).onchange = (e) => { S.moji.datum = e.target.value; save(); route(); };
  $$('[data-pk]', root).forEach(c => c.onchange = () => { if (c.checked) S.plan[c.dataset.pk] = true; else delete S.plan[c.dataset.pk]; save(); c.closest('.planday').classList.toggle('done', c.checked); });
}

/* =========================================================
   NAJPOGOSTEJŠE NAPAKE
   ========================================================= */
function pageNapake() {
  const all = NAPAKE.map(x => Object.assign({ moja: false }, x)).concat((S.napake || []).map((x, i) => Object.assign({ moja: true, idx: i }, x)));
  let h = '<h1>Najpogostejše napake</h1><div class="note">Seznam je sestavljen iz kolokvijev. Napak, ki si jih delal sam, v gradivu ni – dodaj jih z gumbom »+ Dodaj napako« (shrani se v <span class="kbd">localStorage</span> in doda k arrayu).</div>';
  h += '<ol class="proc">' + all.map(x => '<li class="card" style="list-style-position:inside">' + (x.tip !== 'vse' && TIP[x.tip] ? '<span class="badge cnt">' + TIP[x.tip].kratko + '</span> ' : '') + (x.moja ? '<span class="badge miss">moja</span> ' : '') + x.napaka + (x.kakoSeIzognes ? '<div class="small muted" style="margin-top:4px"><b>Kako se izogneš:</b> ' + x.kakoSeIzognes + '</div>' : '') + (x.moja ? ' <button class="small" data-dn="' + x.idx + '">Odstrani</button>' : '') + '</li>').join('') + '</ol>';
  h += '<div class="card"><b>+ Dodaj napako</b><div class="grid2" style="margin-top:6px"><div class="fld"><label for="nTxt">Napaka</label><input type="text" id="nTxt"></div><div class="fld"><label for="nKako">Kako se izogneš</label><input type="text" id="nKako"></div><div class="fld"><label for="nTip">Tip</label><select id="nTip"><option value="vse">vsi tipi</option>' + TIPI.map(t => '<option value="' + t.id + '">' + t.kratko + '</option>').join('') + '</select></div></div><button class="primary" id="nAdd">+ Dodaj napako</button></div>';
  return h;
}
function bindNapake(root) {
  $('#nAdd', root).onclick = () => {
    const t = $('#nTxt', root).value.trim(); if (!t) return;
    (S.napake = S.napake || []).push({ tip: $('#nTip', root).value, napaka: esc(t), kakoSeIzognes: esc($('#nKako', root).value.trim()) }); save(); route();
  };
  $$('[data-dn]', root).forEach(b => b.onclick = () => { S.napake.splice(+b.dataset.dn, 1); save(); route(); });
}

/* =========================================================
   TESTI (?test)
   ========================================================= */
function testsHTML() {
  const pt = runParserTests(), ct = runCalcTests();
  const pOK = pt.filter(r => r.pass).length, cOK = ct.filter(r => r.pass).length;
  console.log('[test] razčlenjevalnik: ' + pOK + '/' + pt.length + ' · kalkulatorji: ' + cOK + '/' + ct.length);
  pt.concat(ct).filter(r => !r.pass).forEach(r => console.error('[test] NAPAKA', r));
  let h = '<div class="card" id="testOut"><h2 style="margin-top:0">Testi</h2><p><b class="' + (pOK === pt.length ? 'pass' : 'fail') + '">Razčlenjevalnik: ' + pOK + '/' + pt.length + '</b> · <b class="' + (cOK === ct.length ? 'pass' : 'fail') + '">Kalkulatorji: ' + cOK + '/' + ct.length + '</b></p>';
  h += '<details><summary>Podrobnosti</summary><div class="tscroll"><table><thead><tr><th>Vnos / test</th><th>Pričakovano</th><th>Dobljeno</th><th></th></tr></thead><tbody>';
  pt.forEach(r => { h += '<tr><td><span class="kbd">' + esc(r.inp) + '</span> (' + r.dim + ')</td><td>' + esc(String(r.exp)) + '</td><td>' + esc(String(r.got)) + '</td><td class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓' : '✗') + '</td></tr>'; });
  ct.forEach(r => { h += '<tr><td>' + esc(r.name) + '</td><td>' + esc(String(r.exp)) + '</td><td>\\(' + r.shown + '\\) <span class="small muted">(' + esc(String(r.got)) + ')</span></td><td class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓' : '✗') + '</td></tr>'; });
  h += '</tbody></table></div></details></div>';
  return h;
}

/* =========================================================
   USMERJANJE
   ========================================================= */
function route() {
  const raw = (location.hash || '#pregled').slice(1);
  const [r, anchor] = raw.split(':');
  const main = $('#main');
  let html, bind, key = r;
  if (r === 'osnove') { html = pageOsnove(); bind = bindOsnove; }
  else if (r.startsWith('tip-') && TIP[r.slice(4)]) { const id = r.slice(4); html = pageTip(id); bind = (root) => bindTip(root, id, anchor); }
  else if (r === 'kviz') { html = pageKviz(); bind = drawQuiz; }
  else if (r === 'sim') { html = pageSim(); bind = (root) => { $$('[data-y]', root).forEach(b => b.onclick = () => { if (SIM.leto !== +b.dataset.y) { clearInterval(SIM.iv); SIM = { leto: +b.dataset.y, run: false, el: 0, t0: 0, iv: null, vals: {}, self: {}, notes: {} }; } route(); }); drawSim(root); }; }
  else if (r === 'plan') { html = pagePlan(); bind = bindPlan; }
  else if (r === 'napake') { html = pageNapake(); bind = bindNapake; }
  else { key = 'pregled'; html = pagePregled(); bind = bindPregled; }
  if (/[?&]test\b/.test(location.search)) html = testsHTML() + html;
  main.innerHTML = '<div class="page">' + html + '</div>';
  const root = main.firstElementChild;
  renderMath(root);
  bind(root);
  buildNav(key);
  if (!anchor) window.scrollTo(0, 0);
  document.title = 'Fizika I – 1. kolokvij';
}

function init() {
  applyTheme();
  $('#themeBtn').onclick = () => { S.theme = THEMES[(THEMES.indexOf(S.theme || 'system') + 1) % 3]; save(); applyTheme(); };
  $('#menuBtn').onclick = () => ($('#side').classList.contains('open') ? closeMenu() : openMenu());
  $('#backdrop').onclick = closeMenu;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('hashchange', route);
  route();
  save();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
